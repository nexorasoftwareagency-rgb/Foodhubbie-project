name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Encoding guard (no mojibake / BOM / C1 controls)
        run: node tests/encoding-check.mjs

      - name: Customer public-read guard (anonymous diner keeps tax/fee/table/coupon reads)
        run: node tests/customer-public-reads.check.cjs

      - name: Admin query-chain guard (a Reference has no orderByChild/limitToLast)
        run: node tests/admin-query-chain.check.cjs

      - name: Chat tab guard (chatMeta query list, dismissible onboarding wall)
        run: node tests/chat-tab.check.cjs

      - name: Admin SW guard (app code is network-first, S-W-R static only)
        run: node tests/admin-sw-networkfirst.check.cjs

      - name: Tables session-window guard (bounded tableSessions read + reconciliation)
        run: node tests/tables-session-window.check.cjs

      - name: Session lifecycle guard (3h scan / 24h order / never cancel a served order)
        run: node tests/session-lifecycle.check.cjs

      - name: KDS guard (badge parity, KOT correctness, phantom Preparing, dead refs)
        run: node tests/kds-check.mjs

      - name: POS mobile guard (full-width picker, honest tile price, one-tap add)
        run: node tests/pos-mobile.check.cjs

      - name: Customer Profile guard (paid-order basis, RFM yardsticks, staff-private notes)
        run: node tests/customer-profile-360.check.mjs

      - name: Customer Database guard (paid basis, filters, duplicate badge, pager)
        run: node tests/customer-dashboard.check.mjs

      - name: Notification checklist guard (eligibility gates, one batch request, honest drafts)
        run: node tests/notify-composer.check.mjs

      - name: Menu cart persistence guard
        run: node tests/menu-cart-refresh.check.cjs

      - name: Legacy QR guard (outlet→business fallback + honest outdated-QR fail)
        run: node tests/menu-legacy-qr.check.cjs

      - name: PIN hashing guard (PBKDF2, legacy upgrade)
        run: node tests/pin-crypto.check.mjs

      - name: Onboarding approval guard (authUid + legacy)
        run: node tests/auto-onboarding.check.cjs

      - name: FCM dead-token prune guard (token-scoped codes only)
        run: node tests/fcm-dead-token-codes.check.cjs

      - name: Loyalty dashboard guard (view math, a11y, config shape)
        run: node tests/loyalty-dashboard.check.mjs

      - name: Menu sub-tabs guard (one sidebar entry, three sub-tabs)
        run: node tests/admin-menu-subtabs.check.mjs

      - name: App Notifications guard (unique ids, pane nesting, payload)
        run: node tests/app-notifications.check.mjs

      - name: Menu add-flow guard (new category, inline checks, live preview)
        run: node tests/admin-add-flow.browser.mjs

      - name: Notification caps guard (frequency + quiet hours)
        run: node tests/notify-caps.check.cjs

      - name: Functions deploy-source guard (firebase.json points at the live tree)
        run: node tests/functions-source.check.cjs

      - name: Install functions dependencies
        working-directory: FIREBASE_SERVER_MIGRATION/functions
        run: npm ci

      - name: Platform health decision table + push copy (compiled module)
        run: npm --prefix FIREBASE_SERVER_MIGRATION/functions run test:health

      - name: Platform health guard (the verdict names its subject; the copy tells the truth)
        run: node tests/platform-health.check.cjs

      - name: Order finalizer guard (socket-free, one finalization path)
        run: node tests/order-finalizer.check.cjs

      - name: Loyalty relay guard (earn/clawback math, claim, one switch)
        run: node tests/loyalty-engine.check.cjs

      - name: Rider relay guard (copy, resolution, leaf triggers, one switch)
        run: node tests/rider-notify.check.cjs

      - name: Daily settlement guard (cron, shared day claim, riderIndex only, record shape)
        run: node tests/daily-settlement.check.cjs

      - name: Demo reseed guard (determinism, 20h claim, demo-only writes, no whatsapp/outletIndex)
        run: node tests/demo-reseed.check.cjs

      - name: Image convert guard (routes deleted, not ported; no base64 back into RTDB)
        run: node tests/image-convert-removal.check.cjs

      - name: Onboarding create guard (menuBank validate parity, sizes map, settings/Bot images)
        run: node tests/onboarding-create.check.cjs

      - name: Wallet gate guard (one cloud writer, shared math, demo skip, armed-only)
        run: node tests/wallet-gate.check.cjs

      - name: Webhook inbox guard (drains webhookInbox, no whole-tree reads)
        run: node tests/webhook-inbox.check.cjs

      - name: Process inbound message guard (opt-out, strikes, sessions, rate limit)
        run: node tests/process-inbound.check.cjs

      - name: Order status alert guard (admin WhatsApp NEW ORDER alert)
        run: node tests/order-status-alert.check.cjs

      - name: Daily reports guard (sales report computation, formatting)
        run: node tests/daily-reports.check.cjs

      - name: Bot command queue guard (operator replies leave from Functions)
        run: node tests/bot-commands.check.cjs

      - name: Coexistence echo guard (Business App replies reach the chat thread, never the inbox)
        run: node tests/coexistence-echo.check.cjs

      - name: RTDB egress guard (no whole-businesses-tree reads in new functions)
        run: node tests/egress-guard.check.cjs

      - name: Supreme dense UI guard (lists, tabs, phone layout, view-only)
        run: node tests/supreme-ui.browser.mjs

      - name: AWS credential retirement guard (no key id, no .pem, no AWS in CI)
        run: node tests/aws-credential-retirement.check.cjs

      - name: Server branch invariant (server is an ancestor of main)
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/server:refs/remotes/origin/server
          node tools/check-server-branch.cjs

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Run unit tests
        working-directory: bot
        run: node --test tests/unit.test.js

      - name: Run 17-GATE structural verification
        run: node gate-verify.js
