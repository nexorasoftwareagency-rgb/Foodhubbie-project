name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Encoding guard (no mojibake / BOM / C1 controls)
        run: node tests/encoding-check.mjs

      - name: Admin query-chain guard (a Reference has no orderByChild/limitToLast)
        run: node tests/admin-query-chain.check.cjs

      - name: Tables session-window guard (bounded tableSessions read + reconciliation)
        run: node tests/tables-session-window.check.cjs

      - name: Session lifecycle guard (3h scan / 24h order / never cancel a served order)
        run: node tests/session-lifecycle.check.cjs

      - name: Menu cart persistence guard
        run: node tests/menu-cart-refresh.check.cjs

      - name: Legacy QR guard (outlet→business fallback + honest outdated-QR fail)
        run: node tests/menu-legacy-qr.check.cjs

      - name: PIN hashing guard (PBKDF2, legacy upgrade)
        run: node tests/pin-crypto.check.mjs

      - name: Onboarding approval guard (authUid + legacy)
        run: node tests/auto-onboarding.check.cjs

      - name: FCM dead-token prune guard (token-scoped codes only)
        run: node tests/fcm-dead-token-codes.check.cjs

      - name: Loyalty dashboard guard (view math, a11y, config shape)
        run: node tests/loyalty-dashboard.check.mjs

      - name: Menu sub-tabs guard (one sidebar entry, three sub-tabs)
        run: node tests/admin-menu-subtabs.check.mjs

      - name: App Notifications guard (unique ids, pane nesting, payload)
        run: node tests/app-notifications.check.mjs

      - name: Menu add-flow guard (new category, inline checks, live preview)
        run: node tests/admin-add-flow.browser.mjs

      - name: Notification caps guard (frequency + quiet hours)
        run: node tests/notify-caps.check.cjs

      - name: Functions deploy-source guard (firebase.json points at the live tree)
        run: node tests/functions-source.check.cjs

      - name: Order finalizer guard (socket-free, one finalization path)
        run: node tests/order-finalizer.check.cjs

      - name: Supreme dense UI guard (lists, tabs, phone layout, view-only)
        run: node tests/supreme-ui.browser.mjs

      - name: Server branch invariant (server is an ancestor of main)
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/server:refs/remotes/origin/server
          node tools/check-server-branch.cjs

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Run unit tests
        working-directory: bot
        run: node --test tests/unit.test.js

      - name: Run 17-GATE structural verification
        run: node gate-verify.js
