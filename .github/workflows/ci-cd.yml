name: FoodHubbie ERP CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FIREBASE_PROJECT: foodhubbie-10
  NODE_VERSION: '20'

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # LINT & TYPE CHECK
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build (verifies esbuild + PurgeCSS)
        run: node tools/build.mjs

      - name: Check for console errors in built JS
        continue-on-error: true
        run: |
          if grep -r "console\.error\|console\.warn" Admin/dist/js/ --include="*.js" | grep -v "console.warn.*\[FCM\]"; then
            echo "⚠️ Console errors/warnings found in production build"
            exit 1
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # UNIT/INTEGRATION TESTS (if any)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Live-prod E2E (real login, real orders): report, never gate a deploy. A
    # flaky run here used to silently skip deploy-production for days.
    continue-on-error: true
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: https://foodhubbie-admins.web.app
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DEPLOY TO FIREBASE PREVIEW (PRs)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-preview:
    name: Deploy Preview Channel
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node tools/build.mjs

      - name: Deploy to Firebase Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          expires: 7d
          entryPoint: ./Admin/dist

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DEPLOY TO PRODUCTION (main branch)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    # Gate on lint only: the E2E job below drives a live prod site and must not
    # decide whether the rules/hosting deploy happens.
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node tools/build.mjs

      # Rules first: they are the security surface and never depend on hosting.
      # Auth via the service account already used by the hosting deploy; legacy
      # FIREBASE_TOKEN (firebase login:ci) is no longer accepted by Firebase.
      - name: Write service account key
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Database Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set +e
          echo "node $(node --version) | sa-bytes $(wc -c < "$GOOGLE_APPLICATION_CREDENTIALS")" > /tmp/diag
          npx -y firebase-tools deploy --only database --project ${{ env.FIREBASE_PROJECT }} --non-interactive > /tmp/rules.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "cli $(npx -y firebase-tools --version 2>&1)" >> /tmp/diag
            tail -6 /tmp/rules.log >> /tmp/diag
            msg=$(tr '\n' '|' < /tmp/diag | sed 's/%/%25/g')
            echo "::error title=rules-deploy::$msg"
            exit $rc
          fi
          tail -4 /tmp/rules.log

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          target: admin
          entryPoint: ./Admin/dist
